<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/src/style/style.css">
    <title>Circuit Game</title>
</head>

<body class="bg-body-tertiary">
    <main id="main-menu" class="text-center py-5">
        <h1 id="title" class="display-1 text-center fw-bold mb-2">Circuit Game</h1>
        <p id="title_descriptor" class="text-center text-body-secondary mb-5">A logic gate puzzle game</p>

        <div class="d-grid gap-4 col-3 mx-auto" >
            <button id="continue-btn" class="btn btn-primary py-3" type="button">Continue</button>
            <button id="new-game-btn" class="btn btn-primary py-3" type="button">New Game</button>
            <button id="mini-game-btn" class="btn btn-primary py-3" type="button">Mini Games</button>
            <button id="settings-btn" class="btn btn-primary py-3" type="button">Settings</button>

        </div>
    </main>

    <main id="level-screen" class="text-center py-5" hidden>
        <h1 class="display-1 text-center fw-bold mb-2">Levels</h1>
        <p class="text-center text-body-secondary mb-5">Choose a level to continue</p>

        <div class="container col-8 col-lg-6">
            <div id="level-grid" class="row row-cols-5 g-3"></div>
            <button id="back-to-menu-btn" class="btn btn-outline-secondary mt-5 px-5 py-2" type="button">Back</button>
        </div>
    </main>

    <main id="scenario-screen" class="py-4" hidden>
        <div class="container col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <button id="scenario-back-btn" class="btn btn-outline-secondary" type="button">Back</button>
                <h1 class="h3 m-0">Real-life scenario</h1>
                <span id="scenario-progress" class="text-body-secondary">Question 1/3</span>
            </div>

            <div class="card card-body mb-4">
                <p class="fs-4 mb-0">
                    <span id="scenario-before"></span>
                    <span id="scenario-blank" class="scenario-blank">?</span>
                    <span id="scenario-after"></span>
                </p>
            </div>

            <p class="mb-2">Drag the missing word into the blank</p>
            <div class="d-flex gap-3 mb-4">
                <div class="btn btn-outline-primary px-4 py-2 scenario-choice" draggable="true" data-gate="AND">AND</div>
                <div class="btn btn-outline-primary px-4 py-2 scenario-choice" draggable="true" data-gate="OR">OR</div>
                <div class="btn btn-outline-primary px-4 py-2 scenario-choice" draggable="true" data-gate="XOR">XOR</div>
            </div>

            <div id="scenario-feedback" class="alert alert-secondary text-start" role="status" aria-live="polite"></div>

            <div class="text-center">
                <button id="scenario-submit-btn" class="btn btn-primary px-5 py-2" type="button">Submit</button>
            </div>
        </div>
    </main>
    

    <!-- konva gameplay here -->
    <div id="game-screen" hidden></div>

    <script type="module" src="src/html/dom-scripts.ts"></script>

</body>

</html>
