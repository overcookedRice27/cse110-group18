<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/src/style/style.css">
    <title>Circuit Game</title>
</head>

<body class="bg-body-tertiary">
    <main id="main-menu" class="text-center py-5">
        <h1 id="title" class="display-1 text-center fw-bold mb-2">Circuit Game</h1>
        <p id="title_descriptor" class="text-center text-body-secondary mb-5">A logic gate puzzle game</p>

        <div class="d-grid gap-4 col-3 mx-auto">
            <button id="continue-btn" class="btn btn-primary py-3" type="button">Continue</button>
            <button id="new-game-btn" class="btn btn-primary py-3" type="button">New Game</button>
            <button id="levels-btn" class="btn btn-primary py-3" type="button">Levels</button>
            <button id="mini-game-btn" class="btn btn-primary py-3" type="button">Mini Games</button>
            <button id="settings-btn" class="btn btn-primary py-3" type="button">Settings</button>
            <button id="level-creator-btn" class="btn btn-primary py-3" type="button">Level Creator</button>

        </div>
    </main>

    <main id="level-screen" class="text-center py-5" hidden>
        <h1 class="display-1 text-center fw-bold mb-2">Levels</h1>
        <p class="text-center text-body-secondary mb-5">Choose a level to continue</p>

        <div class="container col-8 col-lg-6">
            <div id="level-grid" class="row row-cols-5 g-3"></div>
            <button id="back-to-menu-btn" class="btn btn-outline-secondary mt-5 px-5 py-2" type="button">Back</button>
        </div>
    </main>


    <main id="game-view" hidden>
        <header class="border-bottom p-3">
            <button id="game-back-btn" class="btn btn-secondary px-5 py-2" type="button">Back</button>
            <button id="level-save-btn" class="btn btn-primary px-4 py-2 float-end" type="button" hidden>Save</button>
            <span id="level-save-status" class="ms-3" role="status" aria-live="polite"></span>
            <button id="view-toggle-btn" class="btn btn-secondary px-4 py-2 float-end" type="button" hidden>Player
                View</button>
        </header>
        <div id="game-screen"></div>
    </main>

    <main id="truth-table-screen" class="py-4" hidden>
        <div class="container col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <button id="tt-back-btn" class="btn btn-outline-secondary" type="button">Back</button>
                <h1 id="tt-title" class="h3 m-0"></h1>
                <span id="tt-progress" class="text-body-secondary"></span>
            </div>

            <p>Drag the right output into each empty cell.</p>

            <div class="row mb-3">
                <div class="col-8">
                    <table class="table table-bordered text-center">
                        <thead>
                            <tr><th>A \ B</th><th>0</th><th>1</th></tr>
                        </thead>
                        <tbody id="tt-table-body"></tbody>
                    </table>
                </div>

                <div class="col-4">
                    <p class="fw-semibold mb-2">Drag an output:</p>

                    <div class="d-flex gap-3 mb-3">
                        <div class="tt-token btn btn-outline-dark" draggable="true" data-token="0">0</div>
                        <div class="tt-token btn btn-outline-dark" draggable="true" data-token="1">1</div>
                    </div>

                    <button class="btn btn-outline-secondary btn-sm" type="button"
                            data-bs-toggle="collapse" data-bs-target="#tt-rule-collapse"
                            aria-expanded="false" aria-controls="tt-rule-collapse">
                        Show rule
                    </button>
                    <div class="collapse mt-2" id="tt-rule-collapse">
                        <div id="tt-rule" class="card card-body"></div>
                    </div>
                </div>
            </div>

            <div id="tt-feedback" class="alert alert-secondary mb-3" role="status"></div>

            <button id="tt-next-btn" class="btn btn-primary px-5 py-2" type="button" disabled>Next round</button>
        </div>
    </main>
    
    <script type="module" defer src="src/html/dom-scripts.ts"></script>

</body>

</html>
