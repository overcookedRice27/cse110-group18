<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/src/style/style.css">
    <title>Circuit Game</title>
</head>

<body class="bg-body-tertiary">
    <main id="main-menu" class="text-center py-5">
        <h1 id="title" class="display-1 text-center fw-bold mb-2">Circuit Game</h1>
        <p id="title_descriptor" class="text-center text-body-secondary mb-5">A logic gate puzzle game</p>

        <div class="d-grid gap-4 col-3 mx-auto" >
            <button id="continue-btn" class="btn btn-primary py-3" type="button">Continue</button>
            <button id="new-game-btn" class="btn btn-primary py-3" type="button">New Game</button>
            <button id="mini-game-btn" class="btn btn-primary py-3" type="button">Mini Games</button>
            <button id="settings-btn" class="btn btn-primary py-3" type="button">Settings</button>

        </div>
    </main>

    <main id="level-screen" class="text-center py-5" hidden>
        <h1 class="display-1 text-center fw-bold mb-2">Levels</h1>
        <p class="text-center text-body-secondary mb-5">Choose a level to continue</p>

        <div class="container col-8 col-lg-6">
            <div class="row row-cols-5 g-3">
                <div class="col">
                    <div class="ratio ratio-1x1">
                        <button id="level-1-btn" class="btn btn-primary d-flex align-items-center justify-content-center" type="button">Level 1</button>
                    </div>
                </div>
                <div class="col">
                    <div class="ratio ratio-1x1">
                        <button id="level-2-btn" class="btn btn-primary d-flex align-items-center justify-content-center" type="button">Level 2</button>
                    </div>
                </div>
                <div class="col">
                    <div class="ratio ratio-1x1">
                        <button id="level-3-btn" class="btn btn-primary d-flex align-items-center justify-content-center" type="button">Level 3</button>
                    </div>
                </div>
                <div class="col">
                    <div class="ratio ratio-1x1">
                        <button id="level-4-btn" class="btn btn-primary d-flex align-items-center justify-content-center" type="button">Level 4</button>
                    </div>
                </div>
                <div class="col">
                    <div class="ratio ratio-1x1">
                        <button id="level-5-btn" class="btn btn-primary d-flex align-items-center justify-content-center" type="button">Level 5</button>
                    </div>
                </div>
                <div class="col">
                    <div class="ratio ratio-1x1">
                        <button id="level-6-btn" class="btn btn-primary d-flex align-items-center justify-content-center" type="button">Level 6</button>
                    </div>
                </div>
                <div class="col">
                    <div class="ratio ratio-1x1">
                        <button id="level-7-btn" class="btn btn-primary d-flex align-items-center justify-content-center" type="button">Level 7</button>
                    </div>
                </div>
                <div class="col">
                    <div class="ratio ratio-1x1">
                        <button id="level-8-btn" class="btn btn-primary d-flex align-items-center justify-content-center" type="button">Level 8</button>
                    </div>
                </div>
                <div class="col">
                    <div class="ratio ratio-1x1">
                        <button id="level-9-btn" class="btn btn-primary d-flex align-items-center justify-content-center" type="button">Level 9</button>
                    </div>
                </div>
                <div class="col">
                    <div class="ratio ratio-1x1">
                        <button id="level-10-btn" class="btn btn-primary d-flex align-items-center justify-content-center" type="button">Level 10</button>
                    </div>
                </div>
            </div>
        </div>
    </main>


    <!-- konva gameplay here -->
    <div id="game-screen" hidden></div>

    <script defer src="src/dom-scripts.ts"></script>

</body>

</html>
